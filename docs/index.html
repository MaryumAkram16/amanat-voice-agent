<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Amanat — voice AI for community health visits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E14;
    --bg-elev: #12161F;
    --border: rgba(255,255,255,0.09);
    --text: #F2F4F7;
    --text-soft: #8A93A3;
    --amber: #FF9B45;
    --cyan: #2FD4C4;
    --danger: #FF5C72;
    --grad: linear-gradient(135deg, var(--amber), var(--cyan));
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 28px; position: relative; z-index: 1; }
  .display { font-family: "Space Grotesk", sans-serif; }
  .urdu { font-family: "Noto Nastaliq Urdu", serif; direction: rtl; }
  .grad-text {
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ---------- Hero with ambient glow ---------- */
  header.hero {
    position: relative;
    padding: 110px 0 90px;
    text-align: center;
    overflow: hidden;
  }
  .glow {
    position: absolute; top: -220px; left: 50%; transform: translateX(-50%);
    width: 900px; height: 560px;
    background: radial-gradient(closest-side, rgba(255,155,69,0.16), rgba(47,212,196,0.10) 55%, transparent 75%);
    filter: blur(10px);
    pointer-events: none;
    z-index: 0;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 0.85rem; color: var(--text-soft);
    border: 1px solid var(--border); background: var(--bg-elev);
    padding: 7px 16px; border-radius: 999px; margin-bottom: 28px;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); }
  h1.display {
    font-size: clamp(2.4rem, 5.5vw, 4rem);
    font-weight: 700;
    line-height: 1.1;
    margin: 0 auto 20px;
    max-width: 18ch;
    letter-spacing: -0.01em;
  }
  .lede {
    font-size: 1.15rem;
    color: var(--text-soft);
    max-width: 46ch;
    margin: 0 auto 52px;
  }

  /* ---------- Voice button + waveform ---------- */
  .mic-stage { display: flex; flex-direction: column; align-items: center; gap: 22px; position: relative; z-index: 1; }
  .mic-btn {
    position: relative;
    width: 132px; height: 132px; border-radius: 50%;
    border: none; cursor: pointer;
    background: var(--grad);
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 60px -12px rgba(255,155,69,0.45);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .mic-btn:hover { transform: translateY(-2px); }
  .mic-btn:active { transform: translateY(0); }
  .mic-btn::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.14);
    opacity: 0;
  }
  .mic-stage.listening .mic-btn::after { opacity: 1; animation: ring-spin 3s linear infinite; }
  @keyframes ring-spin { to { transform: rotate(360deg); } }
  .mic-btn.speaking { background: linear-gradient(135deg, var(--cyan), #6BE0D6); }
  .mic-icon { width: 46px; height: 46px; }

  .bars { display: flex; align-items: center; gap: 5px; height: 28px; opacity: 0; transition: opacity 0.2s; }
  .mic-stage.listening .bars { opacity: 1; }
  .bars span {
    width: 4px; border-radius: 2px; background: var(--grad);
    animation: bar-bounce 1.1s ease-in-out infinite;
    height: 8px;
  }
  .bars span:nth-child(1) { animation-delay: 0s; }
  .bars span:nth-child(2) { animation-delay: 0.12s; }
  .bars span:nth-child(3) { animation-delay: 0.24s; }
  .bars span:nth-child(4) { animation-delay: 0.36s; }
  .bars span:nth-child(5) { animation-delay: 0.48s; }
  @keyframes bar-bounce {
    0%, 100% { height: 8px; }
    50% { height: 26px; }
  }

  .mic-status { font-size: 0.98rem; color: var(--text-soft); font-family: "Space Grotesk", sans-serif; font-weight: 500; min-height: 1.4em; }
  .mic-status.live { color: var(--cyan); }
  .mic-status.err { color: var(--danger); }
  .mic-hint { font-size: 0.85rem; color: var(--text-soft); opacity: 0.7; }

  /* ---------- Pipeline stepper ---------- */
  .pipeline-stepper { display: flex; gap: 8px; margin-top: 20px; justify-content: center; }
  .pipeline-stepper .step {
    font-size: 0.76rem; padding: 5px 13px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-soft);
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .pipeline-stepper .step.active {
    background: var(--grad); color: #0B0E14; font-weight: 600; border-color: transparent;
  }

  /* ---------- Live transcript ---------- */
  .live-transcript {
    margin-top: 14px; min-height: 1.5em; max-width: 540px; margin-left: auto; margin-right: auto;
    font-size: 0.98rem; color: var(--text-soft); font-style: italic; padding: 0 16px;
  }
  .live-transcript.final { color: var(--text); font-style: normal; font-weight: 500; }

  /* ---------- Escalation banner ---------- */
  .escalation-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: var(--danger); color: #fff; text-align: center;
    padding: 14px 16px; font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 0.92rem;
    transform: translateY(-100%); transition: transform 0.3s ease;
  }
  .escalation-banner.show { transform: translateY(0); animation: flash-bg 0.9s ease-in-out 3; }
  @keyframes flash-bg { 0%, 100% { background: var(--danger); } 50% { background: #ff8a97; } }
